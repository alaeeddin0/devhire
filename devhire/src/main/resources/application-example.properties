# Copy this file to application.properties and replace local values.
# Never commit application.properties.

spring.application.name=devhire
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devhire}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.storage.resume-directory=${RESUME_DIRECTORY:uploads/resumes}