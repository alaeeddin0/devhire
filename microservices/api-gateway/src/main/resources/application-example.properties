spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=unrestricted

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=candidate-profiles
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/candidate-profiles/**

spring.cloud.gateway.server.webmvc.routes[2].id=recruiter-profiles
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/recruiter-profiles/**
